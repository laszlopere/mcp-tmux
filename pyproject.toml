[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tmux"
version = "0.4.0.dev0"
description = "A comprehensive, universal MCP server for driving tmux (local and over SSH)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "László Pere", email = "226979892+laszlopere@users.noreply.github.com" },
]
keywords = ["mcp", "tmux", "terminal", "automation"]
dependencies = [
    "json-repair>=0.61.0",
    "mcp>=1.2.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/laszlopere/mcp-tmux"
Repository = "https://github.com/laszlopere/mcp-tmux"
Issues = "https://github.com/laszlopere/mcp-tmux/issues"
Funding = "https://github.com/sponsors/laszlopere"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mcp-tmux = "mcp_tmux.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tmux"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# `tomli` is the 3.10-only fallback for the stdlib `tomllib` (API-identical) and
# isn't present when type-checking on 3.11+; ignore its missing stubs.
[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true
