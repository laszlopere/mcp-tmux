[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tmux"
version = "0.1.0"
description = "A comprehensive, universal MCP server for driving tmux (local and over SSH)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mcp-tmux" }]
keywords = ["mcp", "tmux", "terminal", "automation"]
dependencies = [
    "mcp>=1.2.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-tmux = "mcp_tmux.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tmux"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
