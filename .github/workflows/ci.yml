name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        # Let uv manage a project venv; installing into the runner's system
        # Python fails under PEP 668 (externally managed).
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Install sshd (loopback SSH tests)
        # tests/conftest.py starts a private sshd on 127.0.0.1; it fails, not
        # skips, when sshd is missing.
        run: |
          if ! [ -x /usr/sbin/sshd ]; then
            sudo apt-get update && sudo apt-get install -y openssh-server
          fi

      - name: Test (pytest)
        # tmux is present on ubuntu-latest, so integration tests run too.
        run: uv run pytest -v
